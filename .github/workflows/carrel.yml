name: carrel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
# One deploy at a time: a push waits for the build before it.
concurrency: carrel-demo
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Buildx reports the digest of the pushed manifest, which the deploy names.
      - uses: docker/setup-buildx-action@v3
      - id: image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/zyx1121/fn-demo:${{ github.sha }}
          build-args: COMMIT=${{ github.sha }}
      - uses: NYCU-WinLab/carrel-deploy@v1
        with:
          tenant: zyx1121
          function: demo
          image: ghcr.io/zyx1121/fn-demo@${{ steps.image.outputs.digest }}
